name: Upload App to LambdaTest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Add your actual build steps here to generate app-debug.apk
      # e.g.:
      # - name: Build APK
      #   run: ./gradlew assembleDebug

      - name: Upload app build to LambdaTest
        run: |
          response=$(curl -s -u "$LT_USERNAME:$LT_ACCESS_KEY" \
            -X POST "https://manual-api.lambdatest.com/app/upload/realDevice" \
            -F "appFile=@./build/output/app-debug.apk" \
            -F "name=Debug_App" \
            -F "custom_id=sampleName" \
            -F "type=android" \
            -F "visibility=individual")
          echo "Upload response: $response"
          app_url=$(echo "$response" | jq -r '.app_url')
          echo "APP_URL=$app_url" >> $GITHUB_ENV
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

      - name: Trigger Sanity Test on TestMu AI
        run: |
          echo "Using uploaded app: $APP_URL"
          # Add your test-trigger command here
